# Bei jedem Push: das Spiel als Web-Version bauen und auf GitHub Pages stellen.
# Spielen im Browser (auch auf dem iPhone in Safari):
#   https://aurelvonwatzdorf.github.io/nr1/
# Einmalig nötig: auf GitHub unter Settings → Pages bei „Source“
# „GitHub Actions“ wählen.
name: Web-Version

on:
  push:
    branches: ["claude/youthful-ptolemy-6ekfbs"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2 holen
        run: |
          curl -sSL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Web-Vorlagen aus dem Zwischenspeicher
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-web-templates-4.7.2
      - name: Web-Vorlagen holen (nur beim ersten Mal)
        if: steps.templates.outputs.cache-hit != 'true'
        run: ./game/tools/vorlagen_holen.sh "$GODOT" web_nothreads_release web_nothreads_debug
      - name: Web-Version bauen
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path game --import >/dev/null 2>&1 || true
          "$GODOT" --headless --path game --export-release "Web" ../build/web/index.html
          test -f build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
